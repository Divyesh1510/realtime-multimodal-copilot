<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      margin: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      font-size: 13px;
      margin: 0 0 8px 0;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-radius: 4px;
      font-size: 10px;
      margin-bottom: 12px;
    }
    .shortcuts {
      background: #111827;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .row:last-child { margin-bottom: 0; }
    kbd {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <h2>⚡ AI Copilot</h2>
  <div class="badge" id="status-badge">Backend Ready</div>
  <p>Discreet HUD active on all tabs (LeetCode, Meet, VS Code).</p>
  
  <div style="margin-bottom: 10px;">
    <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px;">Backend Gateway URL:</label>
    <div style="display: flex; gap: 4px;">
      <input type="text" id="backend-url-input" placeholder="ws://127.0.0.1:8000" style="flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;">
      <button id="save-url-btn" style="background: #4f46e5; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;">Save</button>
    </div>
  </div>

  <div class="shortcuts">
    <div class="row">
      <span>Toggle HUD:</span>
      <kbd>Ctrl+Shift+Y</kbd>
    </div>
    <div class="row">
      <span>Force Query:</span>
      <kbd>Ctrl+Space</kbd>
    </div>
  </div>

  <script>
    const input = document.getElementById("backend-url-input");
    const saveBtn = document.getElementById("save-url-btn");

    chrome.storage?.local.get(["backendUrl"], (res) => {
      input.value = res.backendUrl || "ws://127.0.0.1:8000";
    });

    saveBtn.addEventListener("click", () => {
      const val = input.value.trim() || "ws://127.0.0.1:8000";
      chrome.storage?.local.set({ backendUrl: val }, () => {
        saveBtn.innerText = "Saved!";
        setTimeout(() => saveBtn.innerText = "Save", 1500);
      });
    });
  </script>
</body>
</html>
